<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Asteroid Shooter | Kevin Tchinda</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../common/playable-styles.css">
    <style>
        body {
            overflow: hidden;
        }
        
        #game-container {
            width: 100vw;
            height: calc(100vh - 70px);
            position: relative;
            background-color: #0A0A0A;
        }
        
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: #E6B85C;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        
        .controls-tip {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            color: #A0968A;
            pointer-events: none;
            z-index: 10;
        }
        
        .restart-btn {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background-color: #C45C3A;
            border: none;
            border-radius: 8px;
            padding: 0.5rem 1rem;
            color: #1C1A17;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            z-index: 20;
            pointer-events: auto;
        }
        
        .restart-btn:hover {
            background-color: #A54A2C;
        }
        
        @media (max-width: 768px) {
            .ui-overlay {
                font-size: 12px;
                top: 10px;
                left: 10px;
                right: 10px;
            }
            
            .restart-btn {
                bottom: 70px;
                right: 10px;
                padding: 0.4rem 0.8rem;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="playable-header">
        <div class="container">
            <div class="logo">
                <span class="prompt">>_</span> kevin.tchinda
            </div>
            <a href="/" class="back-button">
                <ion-icon name="arrow-back-outline"></ion-icon>
                Back
            </a>
        </div>
    </div>

    <div id="game-container"></div>
    
    <div class="ui-overlay">
        <span>Score: <span id="score">0</span></span>
        <span>💥 <span id="highScore">0</span></span>
    </div>
    
    <button class="restart-btn" id="restartBtn">↻ Restart</button>
    <div class="controls-tip">
        Move mouse / finger | Click / tap to shoot
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="../common/playable-utils.js"></script>
    <script src="game.js"></script>
</body>
</html>
