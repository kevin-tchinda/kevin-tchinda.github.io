<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Document Scanner | Kevin Tchinda</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../playables/common/playable-styles.css">
    <style>
        .scanner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin-top: 1rem;
        }
        .camera-area {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background-color: var(--bg-surface);
        }
        video, canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        #capturedCanvas {
            position: absolute;
            top: 0;
            left: 0;
            display: none;
        }
        .capture-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            background-color: var(--accent-primary);
            border: 3px solid var(--bg-primary);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            z-index: 10;
        }
        .capture-button:active {
            transform: translateX(-50%) scale(0.95);
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin: 1rem 0;
        }
        button {
            background-color: var(--accent-primary);
            border: none;
            border-radius: 8px;
            padding: 0.5rem 1rem;
            color: var(--bg-primary);
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .flash-btn {
            background-color: var(--bg-surface-lighter);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .edit-area {
            margin-top: 1rem;
            text-align: center;
            display: none;
            width: 100%;
        }
        .canvas-scroll {
            max-height: 60vh;
            overflow-y: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
            background-color: var(--bg-surface);
            margin-bottom: 1rem;
        }
        .corner-canvas {
            width: 100%;
            height: auto;
            display: block;
            cursor: crosshair;
        }
        .result-area {
            margin-top: 1rem;
            text-align: center;
            width: 100%;
        }
        .status {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }
        @media (max-width: 768px) {
            .capture-button {
                width: 60px;
                height: 60px;
            }
            .controls {
                gap: 0.5rem;
            }
            button {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="playable-header">
        <div class="container">
            <div class="logo">
                <span class="prompt">>_</span> kevin.tchinda
            </div>
            <a href="/" class="back-button">
                <ion-icon name="arrow-back-outline"></ion-icon>
                Back
            </a>
        </div>
    </div>

    <div class="container">
        <div class="command-header">
            <span class="command-text">>_ document-scanner --scan</span>
        </div>
        <p style="margin-bottom: 1rem; color: var(--text-secondary);">
            Point your camera at a document. Tap the round button to capture.
        </p>
    </div>

    <div class="scanner-container">
        <div class="camera-area">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="capturedCanvas"></canvas>
            <div id="captureButton" class="capture-button"></div>
        </div>

        <div class="controls">
            <button id="flashBtn" class="flash-btn">Flash Off</button>
        </div>

        <div id="editArea" class="edit-area">
            <div class="canvas-scroll">
                <canvas id="editCanvas" class="corner-canvas"></canvas>
            </div>
            <div class="controls">
                <button id="resetCornersBtn">Reset Corners</button>
                <button id="scanBtn">Apply Scan</button>
                <button id="savePdfBtn">Save as PDF</button>
            </div>
        </div>

        <div class="result-area">
            <canvas id="resultCanvas" class="result-canvas" style="display: none;"></canvas>
            <div id="statusMsg" class="status"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script async src="https://docs.opencv.org/4.10.0/opencv.js" onload="onOpenCvReady();"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="script.js"></script>
</body>
</html>
