<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AI Art Generator | Kevin Tchinda</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../common/playable-styles.css">
    <style>
        .generator-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        
        .command-header {
            margin-bottom: 2rem;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 0.75rem;
        }
        
        .command-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--accent-primary);
        }
        
        .input-group {
            margin-bottom: 1.5rem;
        }
        
        .input-label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--accent-secondary);
            margin-bottom: 0.5rem;
        }
        
        .input-label ion-icon {
            margin-right: 0.5rem;
            vertical-align: middle;
        }
        
        textarea {
            width: 100%;
            background-color: #2C2824;
            border: 1px solid #4A423C;
            border-radius: 8px;
            padding: 0.75rem;
            color: #F5F0E8;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            line-height: 1.5;
            resize: vertical;
        }
        
        textarea:focus {
            outline: none;
            border-color: #C45C3A;
        }
        
        .style-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        
        .style-btn {
            background-color: #2C2824;
            border: 1px solid #4A423C;
            color: #C8C0B5;
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 11px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .style-btn.active {
            background-color: #C45C3A;
            border-color: #E6B85C;
            color: #0A0A0A;
            font-weight: 600;
        }
        
        .style-btn:hover:not(.active) {
            border-color: #C45C3A;
            color: #C45C3A;
        }
        
        .image-upload-area {
            background-color: #2C2824;
            border: 1px dashed #4A423C;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        
        .image-upload-area:hover {
            border-color: #C45C3A;
        }
        
        .image-upload-area ion-icon {
            font-size: 2rem;
            color: #A0968A;
            margin-bottom: 0.5rem;
        }
        
        .image-upload-area span {
            display: block;
            font-size: 11px;
            color: #A0968A;
        }
        
        .image-preview {
            max-width: 100%;
            max-height: 120px;
            border-radius: 8px;
            margin-top: 0.75rem;
            border: 1px solid #4A423C;
        }
        
        .generate-btn {
            width: 100%;
            background-color: #C45C3A;
            border: none;
            border-radius: 8px;
            padding: 0.75rem;
            color: #0A0A0A;
            font-weight: 600;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }
        
        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .generate-btn:hover:not(:disabled) {
            background-color: #A54A2C;
        }
        
        .result-area {
            margin-top: 2rem;
            text-align: center;
        }
        
        .result-image {
            max-width: 100%;
            border-radius: 12px;
            border: 1px solid #4A423C;
            background-color: #2C2824;
        }
        
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: transparent;
            border: 1px solid #C45C3A;
            color: #C45C3A;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 11px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.2s;
        }
        
        .download-btn:hover {
            background-color: #C45C3A;
            color: #0A0A0A;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #0A0A0A;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none;
        }
        
        .status {
            margin-top: 1rem;
            font-size: 11px;
            color: #E6B85C;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>
    <div class="playable-header">
        <div class="container">
            <div class="logo">
                <span class="prompt">>_</span> kevin.tchinda
            </div>
            <a href="/" class="back-button">
                <ion-icon name="arrow-back-outline"></ion-icon>
                Back
            </a>
        </div>
    </div>

    <div class="generator-container">
        <div class="command-header">
            <span class="command-text">>_ art-generator --create</span>
        </div>
        
        <div class="input-group">
            <div class="input-label">
                <ion-icon name="text-outline"></ion-icon>
                Description
            </div>
            <textarea id="promptInput" rows="3" placeholder="ex: un paysage de montagne au coucher du soleil"></textarea>
        </div>
        
        <div class="input-group">
            <div class="input-label">
                <ion-icon name="color-palette-outline"></ion-icon>
                Style artistique
            </div>
            <div class="style-buttons" id="styleButtons">
                <button class="style-btn active" data-style="abstract">Abstrait</button>
                <button class="style-btn" data-style="cubist">Cubiste</button>
                <button class="style-btn" data-style="watercolor">Aquarelle</button>
                <button class="style-btn" data-style="impressionist">Impressionniste</button>
                <button class="style-btn" data-style="modern">Moderne</button>
            </div>
        </div>
        
        <div class="input-group">
            <div class="input-label">
                <ion-icon name="image-outline"></ion-icon>
                Style personnalisé (optionnel)
            </div>
            <div class="image-upload-area" id="imageUploadArea">
                <ion-icon name="cloud-upload-outline"></ion-icon>
                <span>Importer une image de style</span>
                <input type="file" id="styleImageInput" accept="image/*" hidden>
            </div>
            <img id="stylePreview" class="image-preview hidden" alt="Aperçu du style">
        </div>
        
        <button id="generateBtn" class="generate-btn">
            <ion-icon name="color-wand-outline"></ion-icon>
            Générer l'image
        </button>
        
        <div id="status" class="status hidden"></div>
        
        <div class="result-area" id="resultArea">
            <canvas id="resultCanvas" class="result-image" width="512" height="512" style="display: none;"></canvas>
            <img id="resultImg" class="result-image hidden" alt="Image générée">
            <button id="downloadBtn" class="download-btn hidden">
                <ion-icon name="download-outline"></ion-icon>
                Télécharger l'image
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@latest/dist/body-pix.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="generator.js"></script>
</body>
</html>
