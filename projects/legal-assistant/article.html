<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Article | Civil Code Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../playables/common/playable-styles.css">
    <style>
        .article-container {
            max-width: 800px;
            margin: 2rem auto;
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
        }
        .article-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            color: var(--accent-primary);
            margin-bottom: 1rem;
        }
        .article-text {
            line-height: 1.6;
            color: var(--text-primary);
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 2rem;
            color: var(--accent-secondary);
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .error {
            color: var(--accent-danger);
            text-align: center;
            padding: 2rem;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            padding: 2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="playable-header">
        <div class="container">
            <div class="logo">
                <span class="prompt">>_</span> kevin.tchinda
            </div>
            <a href="/projects/legal-assistant/" class="back-button">
                <ion-icon name="arrow-back-outline"></ion-icon>
                Back to Chat
            </a>
        </div>
    </div>

    <div class="container">
        <div class="command-header">
            <span class="command-text">>_ civil-code --article</span>
        </div>
        <div id="articleContent" class="article-container">
            <div class="loading">
                <ion-icon name="hourglass-outline"></ion-icon>
                Loading article...
            </div>
        </div>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script>
        const API_BASE = "https://legal-ccq-assistant.up.railway.app";
        const urlParams = new URLSearchParams(window.location.search);
        const articleNumber = urlParams.get('number');

        async function loadArticle() {
            if (!articleNumber) {
                document.getElementById('articleContent').innerHTML = '<div class="error"><ion-icon name="alert-circle-outline"></ion-icon> No article number provided.</div>';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/articles`);
                if (!response.ok) throw new Error('Failed to load articles');
                const articles = await response.json();

                const article = articles.find(a => a.number === articleNumber);
                if (!article) {
                    document.getElementById('articleContent').innerHTML = `<div class="error"><ion-icon name="alert-circle-outline"></ion-icon> Article ${articleNumber} not found.</div>`;
                    return;
                }

                document.getElementById('articleContent').innerHTML = `
                    <div class="article-number">Article ${article.number}</div>
                    <div class="article-text">${article.text.replace(/\n/g, '<br>')}</div>
                `;
            } catch (err) {
                document.getElementById('articleContent').innerHTML = `<div class="error"><ion-icon name="alert-circle-outline"></ion-icon> Error loading article: ${err.message}</div>`;
            }
        }

        loadArticle();
    </script>
</body>
</html>
